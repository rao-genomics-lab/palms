name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (conda env)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}          # login shell activates the conda env
    steps:
      - uses: actions/checkout@v4

      # The pip section of environment.yml clones a *private* fork
      # (insitucnv @ git+https://github.com/sraorao/insituCNV-copykat.git) that CI
      # can't authenticate to. It's only the CopyKAT half of the CNV backend, which
      # runs in a separate env anyway, and no test imports it (infercnvpy — public,
      # kept — covers the inferCNV path). Strip that one line for the CI env.
      - name: Prepare CI env file (drop private git dependency)
        run: grep -v 'insitucnv @ git+' environment.yml > environment-ci.yml

      - name: Build xenium_viewer env from environment.yml
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-ci.yml
          cache-environment: true    # cache the solved env across runs
          cache-downloads: true

      - name: Run test suite
        env:
          MPLBACKEND: Agg            # headless matplotlib; no X server needed
        run: pytest

  lint:
    name: lint (ruff, errors only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install ruff

      # Pyflakes syntax + undefined-name checks only: a real-bug safety net
      # without style churn on the existing codebase.
      - name: Ruff (E9, F63, F7, F82)
        run: ruff check --select E9,F63,F7,F82 src tests
