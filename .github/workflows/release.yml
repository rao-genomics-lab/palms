# Publishes to PyPI when a v* tag is pushed, using Trusted Publishing (OIDC):
# GitHub mints a short-lived token for this workflow, so no API token is stored
# in the repo or in anyone's keyring. It requires a one-time setup on PyPI:
# Manage project -> Publishing -> add a GitHub publisher for rao-genomics-lab/palms with
# workflow `release.yml` and environment `pypi`.
#
# That registration names the repository, so **a transfer invalidates it**: the OIDC
# claim carries the new owner and PyPI rejects the upload at the end of the run, after
# the tag is already public. The repo moved from `sraorao` to `rao-genomics-lab` on
# 2026-08-31, so the publisher has to be re-added under the new name before the next
# tag — 1.0.0 published from the old one and is unaffected.
#
# The build and the publish are separate jobs on purpose: only the second holds
# `id-token: write`, so nothing that runs arbitrary build code from the tree can
# reach the credential.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:              # dry run: builds and uploads the artifact, publishes nothing

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*

      # PyPI rejects a distribution whose metadata carries a direct URL
      # dependency, and it does so at upload time — after the tag exists. This
      # fails the build instead, where a fix is still cheap.
      - name: Refuse direct references in the metadata
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          whl = next(pathlib.Path("dist").glob("*.whl"))
          meta = next(n for n in zipfile.ZipFile(whl).namelist() if n.endswith("METADATA"))
          bad = [l for l in zipfile.ZipFile(whl).read(meta).decode().splitlines()
                 if l.startswith("Requires-Dist") and " @ " in l]
          if bad:
              sys.exit("PyPI will reject these direct references:\n  " + "\n  ".join(bad))
          print("no direct references")
          PY

      - name: Version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          declared = re.search(r'^version = "(.+)"', pathlib.Path("pyproject.toml").read_text(), re.M).group(1)
          if tag != declared:
              sys.exit(f"tag {tag!r} does not match pyproject version {declared!r}")
          print(f"tag and pyproject agree on {declared}")
          PY

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write             # the only thing this job needs; no secrets
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
