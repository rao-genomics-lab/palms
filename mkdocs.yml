site_name: Xenium Viewer Documentation
site_description: napari-based spatial transcriptomics viewer for Xenium 3.x output
site_url: https://xenium-viewer.readthedocs.io
repo_url: https://github.com/sraorao/xenium_viewer
repo_name: sraorao/xenium_viewer

docs_dir: docs

# docs/ doubles as the GitHub Wiki source, and internal planning notes live there
# too. Same convention the publish script uses (scripts/push_to_wiki.sh): a page is
# Title-Case-With-Hyphens.md, an internal note is lower-case. _Sidebar.md is a wiki
# nav construct and mkdocs has its own nav.
exclude_docs: |
  [a-z]*.md
  _*.md

# Without this a dead cross-link is only an INFO line and the build still "passes",
# which is how a nav for 44 pages shipped for months while every cross-link on the
# rendered site would have 404'd. Measured: 158 of them. --strict turns these into
# build failures.
validation:
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

# docs/ is authored as GitHub Wiki source, where links are extensionless
# ([Clustering](Tab-Clustering)). mkdocs reads those as paths to files that do not
# exist. The hook appends .md at build time, which keeps one link convention in the
# source rather than two.
hooks:
  - mkdocs_hooks.py

theme:
  name: readthedocs

nav:
  - Home: Home.md
  - Installation: Installation.md
  - Interface Overview: Interface-Overview.md
  - Reference:
    - Analysis Templates: Analysis-Templates.md
    - Cells:
      - Clustering: Tab-Clustering.md
      - Cell Coloring: Tab-Cell-Coloring.md
      - Transcripts: Tab-Transcripts.md
      - UMAP: Tab-UMAP.md
    - Genes:
      - Rank Genes: Tab-Rank-Genes.md
      - Markers: Tab-Markers.md
      - Gene Correlation: Tab-Gene-Correlation.md
      - CNV: Tab-CNV.md
    - Spatial:
      - ROI Analysis: Tab-ROI-Analysis.md
      - Ligand-Receptor: Tab-Ligand-Receptor.md
      - Neighborhood Enrichment: Tab-Neighborhood-Enrichment.md
      - Co-occurrence: Tab-Co-occurrence.md
      - Spatial Domains: Tab-Domains.md
      - Annotation Neighborhood: Tab-Annot-Nhood.md
      - Annotation Distance: Tab-Annot-Distance.md
    - Images:
      - H&E Registration: Tab-HE-Registration.md
      - ARMS Overlay: Tab-ARMS-Overlay.md
      - External Images: Tab-External-Images.md
      - Patches: Tab-Patches.md
    - Tools:
      - Annotations: Tab-Annotations.md
      - Segmentation: Tab-Segmentation.md
      - Crop Dataset: Tab-Crop-Dataset.md
      - Notebook: Tab-Notebook.md
      - Dataset: Tab-Dataset.md
      - Cache: Tab-Cache.md
      - Templates: Tab-Templates.md
  - Tutorials:
    - Getting Started: Tutorial-Getting-Started.md
    - Clustering and DEG: Tutorial-Clustering.md
    - H&E Registration: Tutorial-HE-Registration.md
    - ARMS Overlay: Tutorial-ARMS-Overlay.md
    - ROI Analysis: Tutorial-ROI-Analysis.md
    - Annotations: Tutorial-Annotations.md
    - Recovering a Cache: Tutorial-Recovering-a-Cache.md
  - API Reference: API-Reference.md
