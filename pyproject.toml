[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palms"
version = "1.0.1"
description = "PALMS (Provenance-Aware Linking of Multimodal Spatial-omics) — a napari-based viewer that brings spatial transcriptomics, histology and genomic overlays into one coordinate space, and records every action as replayable code"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Srinivasa Rao Rao" }]
keywords = [
    "xenium", "spatial-transcriptomics", "spatial-omics", "multimodal",
    "histopathology", "image-registration", "provenance", "reproducibility",
    "napari", "single-cell", "10x",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X :: Cocoa",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "napari>=0.5",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "scanpy>=1.12",
    "squidpy>=1.8.2",
    "anndata>=0.12",
    "spatialdata>=0.7",
    "spatialdata-io>=0.6",
    "zarr>=3.0,<3.2",
    "dask>=2024.0",
    "dask-image",
    "tifffile",
    "scikit-image",
    "opencv-python",
    "shapely>=2",
    "qtpy",
    "PyQt6",
    "magicgui",
    "superqt",
    "matplotlib",
    "colorcet",
    "adjustText",
    "scipy",
    "scikit-learn",
    "umap-learn",
    "networkx",
    "igraph",
    "leidenalg",
    "pillow",
    "xarray",
    "omnipath",
    # Imported directly by the app, and until now present only as transitive
    # dependencies of napari, zarr, spatialdata and scanpy. Each is a real
    # requirement of ours; see tests/test_declared_dependencies.py.
    "platformdirs",   # resolves ~/.config/palms/templates for user template overrides
    "pygments",       # syntax highlighting in the Notebook tab
    "numcodecs",      # Blosc compressor on the zarr-v2 path of build_custom_segmentation
    "geopandas",      # ROI/annotation polygons in adata_persistence and crop_overlays
    "seaborn",        # violin/box/strip plots in the annotation-distance and gene tabs
    "tqdm",           # the progress bar that reports into the napari status bar
]

[project.optional-dependencies]
celltypist = ["celltypist"]
r = ["rpy2", "anndata2ri"]
gpu = ["torch", "torch-geometric", "pytorch-lightning", "xgboost"]
references = ["readfcs", "rasterio"]
# inferCNV backend. (CopyKAT needs an incompatible R/python-3.11 stack and runs
# in a separate env — see environment-copykat.yml.)
cnv = [
    "infercnvpy>=0.6.0",
    # The `insituCNV-copykat` fork, published under its own name because
    # `insitucnv` on PyPI is upstream's. It imports as `insitucnv` either way;
    # do not install both distributions into one environment.
    "insitucnv-copykat>=0.3",
]
# Novae spatial-domain inference (Spatial -> Domains). Deliberately out of
# environment.yml: it pulls torch + torch-geometric + lightning, and requires
# python >= 3.11, which `full` therefore inherits.
novae = ["novae"]
# Celldega DegaFile export (Tools -> Publish). Pinned, not floating: the
# `insitucnv` git URL was a reproducibility hit once and shipping a second one
# would be worse.
#
# **This extra cannot be installed in one command**, and it is deliberately NOT
# in `full`. Two things have to happen separately, both measured 2026-09-03
# against the live env:
#
# 1. celldega itself must go in with `--no-deps`. It caps `anndata<0.13` and
#    `spatialdata<0.8` while the viewer runs 0.13 and 0.8, so a plain resolve
#    *succeeds* and quietly downgrades the stack: anndata 0.12.19, spatialdata
#    0.7.3, pandas 2.3.3, ome-zarr 0.15.0, plus dask and distributed. Those caps
#    are conservative rather than real — a complete export ran against anndata
#    0.13.2, spatialdata 0.8.0 and pandas 3.0.5.
# 2. Everything else must go in *without* `--no-deps`, because pip ignores
#    extras under that flag. `pip install --dry-run --no-deps
#    'celldega[pre]==0.24.2'` reports "Would install celldega-0.24.2" and
#    nothing more — so the `[pre]` spelling that used to be here brought no
#    pyvips at all, and the export died exactly where naming `[pre]` was
#    supposed to prevent. Hence `celldega` bare, and every dependency listed.
#
# `pyvips-binary` guards an ORDER-DEPENDENT collision. Plain pyvips runs
# against the host's `libvips.so.42`; on a box with Ubuntu's libvips that build
# drags in system HDF5 1.10, while the env's h5py is built for 1.14. Measured
# both ways: `import pyvips` then `import h5py` raises `ValueError: Not a
# datatype` and anndata is dead for the process, whereas h5py first then pyvips
# is fine -- h5py has already bound to the env's HDF5. The viewer is always in
# the safe case (anndata at startup) and so is dega_available, which imports
# celldega.pre before pyvips; that ordering is load bearing and pinned by
# tests/test_dega_export.py. pyvips-binary removes the hazard instead of
# sequencing around it, by shipping its own libvips wheel that pyvips prefers.
# Same shape as the libglx collision in utils/gl_check.py. conda-forge's
# `libvips` also fixes it and is not the route: solving it into the live env
# downgrades napari 0.8 -> 0.7, spatialdata 0.8 -> 0.6.1, squidpy 1.8.2 -> 1.7.
#
# mudata/ipywidgets/anywidget/libpysal/polars are celldega's own runtime imports
# that `--no-deps` skips; none is capped by celldega, so they resolve normally.
# utils/dega_export.install_hint() prints the two commands, and is what the
# Publish tab shows the user.
dega = [
  "celldega==0.24.2",
  "pyvips~=2.2.2", "pyvips-binary",
  "mudata", "ipywidgets", "anywidget", "libpysal", "polars",
]
full = ["palms[celltypist,r,gpu,references,cnv,novae]"]
# Dev only, and deliberately out of `full` and environment.yml: `--mcp` starts an
# unauthenticated localhost server that executes arbitrary Python in the viewer
# process. Alpha software with loose pins; see src/palms/dev_mcp.py.
#
# fastmcp is pinned below 3.0 because napari-mcp declares only `fastmcp>=2.10.3`
# while reaching into `FastMCP._tool_manager._tools` (bridge_server.py drops
# init_viewer/close_viewer that way). fastmcp 3 renamed that private attribute,
# so a fresh install resolves 3.x and the bridge dies at start with
# "'FastMCP' object has no attribute '_tool_manager'". Measured here, not
# guessed. Note fastmcp 3 also pulls `fastmcp-slim`, which installs into the
# same `fastmcp` namespace — downgrading on top of it leaves a half-shadowed
# package that fails on import, so uninstall both before pinning.
mcp = ["napari-mcp>=0.1.0", "fastmcp>=2.10.3,<3"]
# The replay tests execute an exported notebook in a real kernel, so the test
# extra carries nbclient/ipykernel as well as pytest.
test = ["pytest", "nbformat", "nbclient", "ipykernel"]
dev = ["palms[test]", "ruff"]

[project.scripts]
palms = "palms.app:main"
palms-preprocess = "palms.preprocess:main"
palms-build-cache = "palms.loader:main"
palms-rename-dataset = "palms.scripts.rename_dataset:main"
palms-fetch-references = "palms.scripts.fetch_reference_datasets:main"
palms-build-custom-segmentation = "palms.scripts.build_custom_segmentation:main"

[project.urls]
Homepage = "https://github.com/rao-genomics-lab/palms"
Repository = "https://github.com/rao-genomics-lab/palms"
Issues = "https://github.com/rao-genomics-lab/palms/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]        # import palms.* without installing the package
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/palms"]

[tool.hatch.build.targets.sdist]
include = [
    "src/palms",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "environment.yml",
]
