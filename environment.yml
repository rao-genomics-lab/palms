name: palms
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # Core scientific stack — install via conda for binary compatibility
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15
  - scipy
  - scikit-learn
  - scikit-image
  # matplotlib-base, NOT matplotlib: the metapackage bundles a Qt binding, and
  # *which* one depends on the version the solver happens to pick — 3.9.1 pulls
  # `pyqt` (Qt5), 3.9.3+ pulls `pyside6`. CI landed on 3.9.1, so PyQt5 appeared
  # beside PyQt6 and qtpy silently chose it (its preference order is PyQt5 first).
  # Nothing here needs the metapackage: scanpy, squidpy and matplotlib-scalebar
  # all depend on matplotlib-base, and this app supplies its own Qt binding.
  - matplotlib-base
  - colorcet
  - pillow
  - xarray

  # Spatial / single-cell
  - anndata>=0.12
  - scanpy>=1.12
  - squidpy>=1.8.2
  - spatialdata>=0.7
  - dask>=2024.0
  - dask-image
  - zarr>=3.0,<3.2     # tifffile.aszarr imports zarr.core.chunk_grids.RegularChunkGrid, removed in zarr 3.2
  - tifffile
  - shapely>=2
  - umap-learn
  - python-igraph
  - leidenalg
  - networkx
  - nbformat          # export the reproducible-code graph as a .ipynb notebook
  - nbclient          # execute an exported notebook (replay verification)
  - ipykernel         # the kernel that replay runs in

  # GUI / Qt stack
  # napari is pinned because the solver otherwise happily drops to 0.7.0 to ease
  # an unrelated constraint (the zarr<3.2 pin above) — a silent downgrade of the
  # thing this app *is*. napari deprecated the PyQt5 backend for removal in
  # autumn 2026 and names PyQt6/PySide6 as the replacements; conda-forge ships
  # PyQt6 as `pyqt6`, not as a 6.x of `pyqt` (which stops at 5.15).
  - napari>=0.8
  - pyqt6
  - qtpy
  - magicgui
  - superqt
  # NOTE: Linux and WSL additionally need `libglx-devel`, which fixes a Qt6
  # startup abort (SIGABRT, no traceback) on remote X displays. It is NOT here
  # because it is a linux-only conda-forge package and its presence made this
  # file unsolvable on macOS. It lives in `environment-linux.yml` instead, which
  # scripts/install.sh applies automatically on Linux. See that file for the
  # full root cause.

  # Image processing
  - py-opencv

  # Pip + pypi-only deps + the package itself
  - pip
  - pip:
      # pypi-only runtime deps
      - spatialdata-io>=0.6
      - adjustText
      - omnipath
      # InSituCNV CNV inference (inferCNV backend; the fork also provides run_copykat,
      # but the CopyKAT R backend runs in the separate palms_copykat env).
      - infercnvpy>=0.6.0
      - insitucnv-copykat>=0.3
      # the package itself, editable
      - -e .

# ─────────────────────────────────────────────────────────────────────────────
# Quick start:
#     conda env create -f environment.yml    # (mamba env create is much faster)
#     conda activate palms
#     palms /path/to/xenium/output
#
# CopyKAT backend (optional): CopyKAT needs an R stack that requires python 3.11,
# which is incompatible with this env's python 3.12. So it runs in a SECOND env:
#     conda env create -f environment-copykat.yml   # creates 'palms_copykat'
# The viewer auto-detects that env and runs the (slow, ~2h) CopyKAT analysis there
# as a detached background job. inferCNV runs in this env; no extra env needed for it.
#
# Optional extras (install on top of the above env):
#     pip install -e ".[celltypist]"   # CellTypist label transfer
#     pip install -e ".[r]"            # rpy2-based reference fetcher (needs system R)
#     pip install -e ".[gpu]"          # torch / torch-geometric / xgboost
#     pip install -e ".[references]"   # rasterio + readfcs
#     pip install -e ".[cnv]"          # InSituCNV/infercnvpy CNV inference
#     pip install -e ".[full]"         # all of the above
# ─────────────────────────────────────────────────────────────────────────────
