name: xenium_viewer
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12

  # Core scientific stack — install via conda for binary compatibility
  - numpy>=1.26
  - pandas>=2.0
  - pyarrow>=15
  - scipy
  - scikit-learn
  - scikit-image
  - matplotlib
  - colorcet
  - pillow
  - xarray

  # Spatial / single-cell
  - anndata>=0.12
  - scanpy>=1.12
  - squidpy>=1.8.2
  - spatialdata>=0.7
  - dask>=2024.0
  - dask-image
  - zarr>=3.0,<3.2     # tifffile.aszarr imports zarr.core.chunk_grids.RegularChunkGrid, removed in zarr 3.2
  - tifffile
  - shapely>=2
  - umap-learn
  - python-igraph
  - leidenalg
  - networkx
  - nbformat          # export the reproducible-code graph as a .ipynb notebook
  - nbclient          # execute an exported notebook (replay verification)
  - ipykernel         # the kernel that replay runs in

  # GUI / Qt stack
  - napari
  - pyqt=5
  - qtpy
  - magicgui
  - superqt

  # Image processing
  - py-opencv

  # Pip + pypi-only deps + the package itself
  - pip
  - pip:
      # pypi-only runtime deps
      - spatialdata-io>=0.6
      - adjustText
      - omnipath
      # InSituCNV CNV inference (inferCNV backend; the fork also provides run_copykat,
      # but the CopyKAT R backend runs in the separate xenium_viewer_copykat env).
      - infercnvpy>=0.6.0
      - insitucnv @ git+https://github.com/sraorao/insituCNV-copykat.git
      # the package itself, editable
      - -e .

# ─────────────────────────────────────────────────────────────────────────────
# Quick start:
#     conda env create -f environment.yml    # (mamba env create is much faster)
#     conda activate xenium_viewer
#     xenium-viewer /path/to/xenium/output
#
# CopyKAT backend (optional): CopyKAT needs an R stack that requires python 3.11,
# which is incompatible with this env's python 3.12. So it runs in a SECOND env:
#     conda env create -f environment-copykat.yml   # creates 'xenium_viewer_copykat'
# The viewer auto-detects that env and runs the (slow, ~2h) CopyKAT analysis there
# as a detached background job. inferCNV runs in this env; no extra env needed for it.
#
# Optional extras (install on top of the above env):
#     pip install -e ".[celltypist]"   # CellTypist label transfer
#     pip install -e ".[r]"            # rpy2-based reference fetcher (needs system R)
#     pip install -e ".[gpu]"          # torch / torch-geometric / xgboost
#     pip install -e ".[references]"   # rasterio + readfcs
#     pip install -e ".[cnv]"          # InSituCNV/infercnvpy CNV inference
#     pip install -e ".[full]"         # all of the above
# ─────────────────────────────────────────────────────────────────────────────
