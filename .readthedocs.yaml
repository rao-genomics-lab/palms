# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml
  # Fail the build on a broken link or a page missing from the nav, rather than
  # publishing a site with dead cross-links — which is the state this repo was
  # already in, silently, because nothing ever built the site.
  fail_on_warning: true

python:
  install:
    - requirements: requirements-docs.txt
